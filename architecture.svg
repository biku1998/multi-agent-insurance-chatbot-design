<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 920" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#444"/>
    </marker>
    <marker id="arrow-left" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6 Z" fill="#888"/>
    </marker>
  </defs>

  <!-- Client -->
  <rect x="250" y="10" width="300" height="40" rx="6" fill="#e8f4fd" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="400" y="35" text-anchor="middle" font-weight="600" fill="#2c5282">Client (Web / Mobile)</text>

  <!-- Arrow -->
  <line x1="400" y1="50" x2="400" y2="80" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- API Gateway -->
  <rect x="180" y="80" width="440" height="50" rx="6" fill="#e8f4fd" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="400" y="100" text-anchor="middle" font-weight="600" fill="#2c5282">API Gateway / Chat Interface</text>
  <text x="400" y="118" text-anchor="middle" font-size="11" fill="#666">(Auth check, session management, rate limiting)</text>

  <!-- Arrow -->
  <line x1="400" y1="130" x2="400" y2="160" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Input Guardrails -->
  <rect x="275" y="160" width="250" height="55" rx="6" fill="#fef3c7" stroke="#d69e2e" stroke-width="1.5"/>
  <text x="400" y="182" text-anchor="middle" font-weight="600" fill="#744210">Input Guardrails</text>
  <text x="400" y="200" text-anchor="middle" font-size="11" fill="#666">(PII, injection, off-topic filter)</text>

  <!-- Arrow -->
  <line x1="400" y1="215" x2="400" y2="245" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Orchestrator / Router -->
  <rect x="260" y="245" width="280" height="60" rx="6" fill="#e9d5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="400" y="270" text-anchor="middle" font-weight="600" fill="#5b21b6">Orchestrator / Router Agent</text>
  <text x="400" y="290" text-anchor="middle" font-size="11" fill="#666">(Intent classification + routing)</text>

  <!-- Memory arrows to Router -->
  <line x1="540" y1="260" x2="620" y2="260" stroke="#888" stroke-width="1" stroke-dasharray="5,3" marker-start="url(#arrow-left)"/>
  <text x="625" y="256" font-size="11" fill="#666">Short-term Memory</text>

  <line x1="540" y1="282" x2="620" y2="282" stroke="#888" stroke-width="1" stroke-dasharray="5,3" marker-start="url(#arrow-left)"/>
  <text x="625" y="278" font-size="11" fill="#666">Long-term Memory</text>
  <text x="625" y="292" font-size="10" fill="#999">(if authenticated)</text>

  <!-- Arrows to 3 agents -->
  <line x1="310" y1="305" x2="170" y2="345" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="305" x2="400" y2="345" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="305" x2="630" y2="345" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Policy Agent -->
  <rect x="80" y="345" width="180" height="60" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="170" y="370" text-anchor="middle" font-weight="600" fill="#166534">Policy Agent</text>
  <text x="170" y="388" text-anchor="middle" font-size="11" fill="#666">(+ billing)</text>

  <!-- Claims Agent -->
  <rect x="310" y="345" width="180" height="60" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="400" y="370" text-anchor="middle" font-weight="600" fill="#166534">Claims Agent</text>

  <!-- FAQ Agent -->
  <rect x="540" y="345" width="180" height="60" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="630" y="370" text-anchor="middle" font-weight="600" fill="#166534">FAQ / General Agent</text>

  <!-- Arrows to Knowledge Layer -->
  <line x1="170" y1="405" x2="170" y2="445" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="405" x2="400" y2="445" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="630" y1="405" x2="630" y2="445" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Knowledge / Data Layer box -->
  <rect x="80" y="445" width="640" height="100" rx="6" fill="#f8f8f8" stroke="#888" stroke-width="1.5"/>
  <text x="400" y="465" text-anchor="middle" font-weight="600" fill="#333">Knowledge / Data Layer</text>

  <!-- Knowledge Base sub-box -->
  <rect x="100" y="475" width="280" height="55" rx="4" fill="#fff" stroke="#bbb" stroke-width="1"/>
  <text x="240" y="497" text-anchor="middle" font-weight="500" fill="#444">Knowledge Base (RAG)</text>
  <text x="240" y="515" text-anchor="middle" font-size="11" fill="#888">All users</text>

  <!-- Customer Data sub-box -->
  <rect x="420" y="475" width="280" height="55" rx="4" fill="#fff" stroke="#bbb" stroke-width="1"/>
  <text x="560" y="497" text-anchor="middle" font-weight="500" fill="#444">Customer Data Layer</text>
  <text x="560" y="515" text-anchor="middle" font-size="11" fill="#888">Authenticated users only</text>

  <!-- Arrow -->
  <line x1="400" y1="545" x2="400" y2="580" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Output Guardrails -->
  <rect x="275" y="580" width="250" height="65" rx="6" fill="#fef3c7" stroke="#d69e2e" stroke-width="1.5"/>
  <text x="400" y="605" text-anchor="middle" font-weight="600" fill="#744210">Output Guardrails</text>
  <text x="400" y="622" text-anchor="middle" font-size="11" fill="#666">(Hallucination, disclaimers,</text>
  <text x="400" y="636" text-anchor="middle" font-size="11" fill="#666">compliance filter)</text>

  <!-- Arrow -->
  <line x1="400" y1="645" x2="400" y2="675" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Response -->
  <rect x="290" y="675" width="220" height="40" rx="6" fill="#e8f4fd" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="400" y="700" text-anchor="middle" font-weight="600" fill="#2c5282">Response to User</text>

  <!-- Cross-cutting Concerns -->
  <rect x="100" y="760" width="600" height="140" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="400" y="785" text-anchor="middle" font-weight="600" fill="#475569">Cross-cutting Concerns</text>

  <!-- Observability sub-box -->
  <rect x="130" y="800" width="240" height="80" rx="4" fill="#fff" stroke="#94a3b8" stroke-width="1"/>
  <text x="250" y="825" text-anchor="middle" font-weight="500" fill="#444">Observability</text>
  <text x="250" y="845" text-anchor="middle" font-size="11" fill="#888">Traces, logs, metrics,</text>
  <text x="250" y="860" text-anchor="middle" font-size="11" fill="#888">evaluation pipelines</text>

  <!-- Human Handoff sub-box -->
  <rect x="430" y="800" width="240" height="80" rx="4" fill="#fff" stroke="#94a3b8" stroke-width="1"/>
  <text x="550" y="825" text-anchor="middle" font-weight="500" fill="#444">Human Handoff</text>
  <text x="550" y="845" text-anchor="middle" font-size="11" fill="#888">Escalation to live agent</text>
  <text x="550" y="860" text-anchor="middle" font-size="11" fill="#888">with conversation context</text>
</svg>
